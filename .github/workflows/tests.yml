name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/base.txt pytest pyflakes

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Skill self-check
        run: python investigator-2-0/scripts/check_skill.py

      - name: Prepare base profile (.venv)
        run: python bootstrap.py --profile base

      - name: Installer check mode (read-only, no downloads)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\setup-windows.ps1 -Profile base -CheckOnly

      - name: pyflakes (advisory)
        continue-on-error: true
        run: python -m pyflakes bootstrap.py setup_windows.py system_tools.py local_config.py run.py connect_skills.py investigator-2-0/scripts tests
